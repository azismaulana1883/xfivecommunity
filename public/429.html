<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>429 - Akses Dibatasi</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      color: #ffffff;
      overflow: hidden;
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .bg-glow {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(220,38,38,0.12) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: glowPulse 4s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem 1.5rem;
      max-width: 520px;
      width: 100%;
    }

    .shield-icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 2rem;
      position: relative;
      animation: floatIcon 3s ease-in-out infinite;
    }

    @keyframes floatIcon {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .shield-icon svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 25px rgba(220,38,38,0.4));
    }

    .lock-body {
      animation: lockPulse 2.5s ease-in-out infinite;
    }

    @keyframes lockPulse {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }

    .error-code {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #ef4444;
      margin-bottom: 1rem;
      display: inline-block;
      background: rgba(220,38,38,0.1);
      border: 1px solid rgba(220,38,38,0.25);
      padding: 0.35rem 1.2rem;
      border-radius: 999px;
    }

    .headline {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #ffffff 0%, #a0a0a0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtext {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #9ca3af;
      margin-bottom: 2rem;
      font-weight: 400;
    }

    .divider {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(220,38,38,0.5), transparent);
      margin: 0 auto 1.5rem;
    }

    .credit {
      font-size: 0.8rem;
      color: #4b5563;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    @media (max-width: 480px) {
      .shield-icon {
        width: 90px;
        height: 90px;
        margin-bottom: 1.5rem;
      }

      .headline {
        font-size: 1.5rem;
      }

      .subtext {
        font-size: 0.95rem;
      }

      .error-code {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <div class="container">
    <div class="shield-icon">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Shield shape -->
        <path d="M50 5 L90 20 L90 50 C90 75 70 92 50 97 C30 92 10 75 10 50 L10 20 Z"
              fill="rgba(220,38,38,0.08)" stroke="#ef4444" stroke-width="2" class="lock-body"/>
        <!-- Lock body -->
        <rect x="36" y="48" width="28" height="22" rx="3" fill="#ef4444" opacity="0.9"/>
        <!-- Lock shackle -->
        <path d="M40 48 L40 38 C40 31 44 27 50 27 C56 27 60 31 60 38 L60 48"
              stroke="#ef4444" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.9"/>
        <!-- Keyhole -->
        <circle cx="50" cy="57" r="3" fill="#0a0a0f"/>
        <rect x="49" y="58" width="2" height="5" rx="1" fill="#0a0a0f"/>
      </svg>
    </div>

    <div class="error-code">Error 429</div>

    <h1 class="headline">Akses Lu Dibatasi Sementara</h1>

    <p class="subtext">
      Terlalu banyak permintaan terdeteksi dari koneksi Anda.<br>
      Untuk melindungi website, akses lu sementara dibatasi.<br>
      Silakan coba lagi!
    </p>

    <div class="divider"></div>

    <p class="credit">Ramsky x Fasky</p>
  </div>
</body>
</html>
